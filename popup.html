<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/playback-status.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <div id="status">
  </div>
  <div id="buttons">
    <i class="material-icons button-1" id="btnRewind">&#xe020;</i>
    <img src="img/loading.gif" id="imgLoading" />
    <i class="material-icons button-1" id="btnPlay">&#xe037;</i>
    <i class="material-icons button-1" id="btnPause">pause</i>
    <i class="material-icons button-1" id="btnStop">stop</i>
    <i class="material-icons button-1" id="btnSettings">settings</i>
    <i class="material-icons button-1" id="btnForward">&#xe01f;</i>
  </div>
  <div id="highlight">
  </div>
  <div id="reading-controls" hidden>
    <details id="playback-status" hidden>
      <summary><span id="playback-voice"></span><span id="playback-progress"></span></summary>
      <div id="playback-details"></div>
    </details>
    <button id="toggle-reading-controls" type="button" aria-controls="toolbar" aria-expanded="false">
      <i class="material-icons" aria-hidden="true">tune</i>
    </button>
    <div id="toolbar" hidden>
      <div class="btn-group">
        <button id="decrease-font-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true">text_decrease</i>
        </button>
        <button id="increase-font-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true">text_increase</i>
        </button>
      </div>
      <div class="btn-group window-size">
        <button id="decrease-window-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true">fullscreen_exit</i>
        </button>
        <button id="increase-window-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true">fullscreen</i>
        </button>
      </div>
      <div class="btn-group">
        <button id="toggle-dark-mode" type="button" class="btn">
          <i class="material-icons">dark_mode</i>
        </button>
      </div>
      <div class="btn-group">
        <button id="report-issue" type="button" class="btn">
          <i class="material-icons" aria-hidden="true">bug_report</i>
        </button>
      </div>
    </div>
  </div>
  <div id="footer"></div>
</body>
</html>
