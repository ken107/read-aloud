<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/playback-status.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <div id="status">
  </div>
  <div id="buttons">
    <i class="material-icons button-1" id="btnRewind"><svg><use href="img/icons.svg#fast_rewind"/></svg></i>
    <img src="img/loading.svg" id="imgLoading" />
    <i class="material-icons button-1" id="btnPlay"><svg><use href="img/icons.svg#play_arrow"/></svg></i>
    <i class="material-icons button-1" id="btnPause"><svg><use href="img/icons.svg#pause"/></svg></i>
    <i class="material-icons button-1" id="btnStop"><svg><use href="img/icons.svg#stop"/></svg></i>
    <i class="material-icons button-1" id="btnSettings"><svg><use href="img/icons.svg#settings"/></svg></i>
    <i class="material-icons button-1" id="btnForward"><svg><use href="img/icons.svg#fast_forward"/></svg></i>
  </div>
  <div id="highlight">
  </div>
  <div id="reading-controls" hidden>
    <details id="playback-status" hidden>
      <summary><span id="playback-voice"></span><span id="playback-progress"></span></summary>
      <div id="playback-details"></div>
    </details>
    <button id="toggle-reading-controls" type="button" aria-controls="toolbar" aria-expanded="false">
      <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#tune"/></svg></i>
    </button>
    <div id="toolbar" hidden>
      <div class="btn-group">
        <button id="decrease-font-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#text_decrease"/></svg></i>
        </button>
        <button id="increase-font-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#text_increase"/></svg></i>
        </button>
      </div>
      <div class="btn-group window-size">
        <button id="decrease-window-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#fullscreen_exit"/></svg></i>
        </button>
        <button id="increase-window-size" type="button" class="btn">
          <i class="material-icons" aria-hidden="true"><svg><use href="img/icons.svg#fullscreen"/></svg></i>
        </button>
      </div>
      <div class="btn-group">
        <button id="toggle-dark-mode" type="button" class="btn">
          <i class="material-icons"><svg><use href="img/icons.svg#dark_mode"/></svg></i>
        </button>
      </div>
    </div>
  </div>
  <div id="footer"><a id="report-issue" href="report.html?referer=popup.html"></a></div>
</body>
</html>
